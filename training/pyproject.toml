[project]
name = "wand-train"
version = "0.1.0"
description = "Training tool for the magic wand classifier."
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "pandas>=2.2",
    "pyarrow>=17",
    "wand-core",
]

[project.scripts]
wand-train = "wand_train.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wand_train"]

[tool.uv.sources]
wand-core = { workspace = true }
