# Settings of the data collection application. Override per machine in
# data-collection.local.yaml (not in git), for example to record into a
# dataset of your own.

# The folder that holds the datasets, one folder for each dataset.
dataLocation: data
# The dataset to record into: a folder name inside dataLocation (lowercase
# letters, digits, hyphens and underscores). It is created if it is missing.
# Set it to your own name in data-collection.local.yaml.
dataset: default
server:
  # Where the application listens. Local only by default.
  host: 127.0.0.1
  port: 8000
camera:
  # Preferred camera and the requested mode.
  index: 0
  width: 640
  height: 480
  fps: 30
# Length of the countdown before capturing starts, in seconds.
countdownS: 3.0
# Video clip padding before and after the gesture, in seconds.
clipPadding:
  preS: 2.0
  postS: 2.0
# End threshold as a fraction of the start threshold.
endThresholdRatio: 0.6
# Show the live view mirrored, like a mirror, so your right hand appears on the
# right side of the picture. Only what is shown is mirrored: tracking, stored
# positions and video clips are never mirrored.
mirrorPreview: true
# Keyboard shortcuts (browser key names; a space is " "). An action can have
# one key or a list of keys, and the first is shown on its button. Keys 1 to 9
# always select labels.
shortcuts:
  pause: Escape
  previous: ArrowLeft
  next: ArrowRight
  up: ArrowUp
  down: ArrowDown
  reject: [" ", r]
  delete: Backspace
  toggleView: v
  scrubOpen: s
  # The scrubbing view takes over the keys while it is open.
  scrubPlay: " "
  scrubBack: ArrowLeft
  scrubForward: ArrowRight
  scrubBackMany: Shift+ArrowLeft
  scrubForwardMany: Shift+ArrowRight
  scrubStart: Home
  scrubEnd: End
  scrubFullScreen: f
  scrubVideo: v
  scrubClose: Escape
