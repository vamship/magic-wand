[project]
name = "wand-collect"
version = "0.1.0"
description = "Data collection application for the magic wand."
requires-python = ">=3.11"
dependencies = ["wand-core"]

[project.scripts]
wand-collect = "wand_collect.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wand_collect"]

[tool.uv.sources]
wand-core = { workspace = true }
