[project]
name = "wand-collect"
version = "0.1.0"
description = "Data collection application for the magic wand."
requires-python = ">=3.11"
dependencies = [
    "av>=18.1.0",
    "fastapi>=0.162.0",
    "platformdirs>=4.3",
    "ruamel-yaml>=0.18",
    "uvicorn>=0.54.0",
    "wand-core",
]

[project.scripts]
wand-collect = "wand_collect.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wand_collect"]

[tool.uv.sources]
wand-core = { workspace = true }
